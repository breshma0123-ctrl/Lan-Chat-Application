<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LAN Chat Application</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon">📝</div>
            <h1>Create LAN Account</h1>
            <p>Join the Local Area Network Chat Server</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="registerForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Choose a Username</label>
                <input type="text" id="username" class="form-control" placeholder="e.g. Suba, Priya, Anu" required autofocus>
                <small style="font-size: 11px; color: var(--text-muted); margin-top: 4px; display: block;">
                    3-30 characters (letters, numbers, underscores)
                </small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Create a secure password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your password" required>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
                <span>Create Account</span> &rarr;
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="/login">Sign in here</a></p>
            <p style="margin-top: 12px; font-size: 13px;">
                <a href="/about" style="color: var(--text-muted);">&bull; Explore Computer Networks Concepts &bull;</a>
            </p>
        </div>
    </div>

    <script src="/js/register.js"></script>
</body>
</html>
