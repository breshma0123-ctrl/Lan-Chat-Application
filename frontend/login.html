<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LAN Chat Application</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon">💬</div>
            <h1>LAN Chat Application</h1>
            <p>Computer Networks Project &bull; Local Area Network</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
                <span>Sign In to LAN</span> &rarr;
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="/register">Register here</a></p>
            <p style="margin-top: 12px; font-size: 13px;">
                <a href="/about" style="color: var(--text-muted);">&bull; Explore Computer Networks Concepts &bull;</a>
            </p>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
